[build]
  # Updates the database tables, adds example questions to a brand-new
  # database, then builds the site.
  command = "npm run deploy:build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Old Netlify address -> the real domain
[[redirects]]
  from = "https://sharesecretly.netlify.app/*"
  to = "https://saysecretly.com/:splat"
  status = 301
  force = true
